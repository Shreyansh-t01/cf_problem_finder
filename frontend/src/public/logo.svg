<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     fill="none">

  <defs>
    <linearGradient id="blockGradient" x1="80" y1="100" x2="330" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91A5FF"/>
      <stop offset="0.5" stop-color="#5145F5"/>
      <stop offset="1" stop-color="#3210C9"/>
    </linearGradient>

    <linearGradient id="orbitGradient" x1="70" y1="280" x2="390" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B7AFF"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="670" y1="100" x2="1100" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5145F5"/>
      <stop offset="1" stop-color="#8B35E9"/>
    </linearGradient>
  </defs>


  <g>
    <rect x="65" y="175" width="100" height="100"
          fill="#7188F7" opacity="0.85"/>

    <rect x="165" y="105" width="100" height="170"
          fill="#5961F3" opacity="0.85"/>

    <rect x="265" y="35" width="100" height="240"
          fill="url(#blockGradient)"/>

    
    <rect x="165" y="175" width="100" height="100"
          fill="#3922E7" opacity="0.55"/>

    <rect x="265" y="105" width="100" height="70"
          fill="#5145F5" opacity="0.65"/>

    <rect x="265" y="175" width="100" height="100"
          fill="#3914D8" opacity="0.65"/>

    <rect x="315" y="225" width="50" height="50"
          fill="#210B9D"/>

    <path d="M 45 275 C 120 325, 340 210, 390 110"
          stroke="url(#orbitGradient)"
          stroke-width="9"
          stroke-linecap="round"
          opacity="0.9"/>

    
    <path d="M 365 0
             C 369 24, 376 30, 395 35
             C 376 40, 369 47, 365 70
             C 361 47, 354 40, 335 35
             C 354 30, 361 24, 365 0Z"
          fill="#5735ED"/>
  </g>

  
  <path d="M 425 55 V 275"
        stroke="#D9DCEF"
        stroke-width="2"/>

  
  <text x="470" y="190"
        font-family="Inter, Arial, sans-serif"
        font-size="130"
        font-weight="750"
        letter-spacing="-5"
        fill="#11152F">CF</text>

  <text x="642" y="190"
        font-family="Inter, Arial, sans-serif"
        font-size="130"
        font-weight="750"
        letter-spacing="-5"
        fill="url(#textGradient)">Helper</text>


 

